# Prometheus alerting rules for Catchment (generic llcforge-alert metrics).
# Load with `rule_files: ["catchment-rules.yml"]` or as a PrometheusRule `spec`.
# Assumes the scrape job is named "catchment"; adjust the `job` matcher if not.
groups:
  - name: catchment.availability
    rules:
      - alert: CatchmentDown
        expr: up{job="catchment"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Catchment is down on {{ $labels.instance }}"
          description: "The Catchment metrics endpoint has not been scrapeable for 5 minutes."

      - alert: CatchmentAbsent
        expr: absent(up{job="catchment"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No Catchment targets are being scraped"

  - name: catchment.alert-delivery
    rules:
      - alert: CatchmentAlertDeliveryFailing
        expr: increase(llcforge_alert_sink_failed_total{tool="catchment"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Catchment cannot deliver alerts to sink {{ $labels.sink }} ({{ $labels.type }})"
          description: "{{ $value | humanize }} delivery failures in 15 minutes. Undelivered alerts stay queued and are retried."

      - alert: CatchmentAlertsDropped
        expr: increase(llcforge_alert_dropped_total{tool="catchment"}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Catchment dropped alerts on {{ $labels.instance }}"
          description: "Alerts were dropped (intake channel full, queue bound reached or delivery expired)."

      - alert: CatchmentAlertQueueBacklog
        expr: llcforge_alert_queue_depth{tool="catchment"} > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Catchment alert queue backlog: {{ $value }} pending"
          description: "Alerts are accumulating faster than sinks accept them, or a sink has been down for 15 minutes."

      - alert: CatchmentSinkBacklog
        expr: llcforge_alert_sink_queued{tool="catchment"} > 50
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Catchment sink {{ $labels.sink }} has {{ $value }} undelivered alerts"

  - name: catchment.measurement
    rules:
      - alert: CatchmentRoundsFailing
        expr: increase(catchment_rounds_total{job="catchment",outcome="failed"}[1h]) > 0 and increase(catchment_rounds_total{job="catchment",outcome="ok"}[1h]) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Catchment service {{ $labels.service }} has no successful round in 1 hour"
          description: "Every round failed (no vantage produced an observation). Check RIPE Atlas credits, agents and network access."

      - alert: CatchmentStale
        expr: time() - catchment_last_round_timestamp_seconds{job="catchment"} > 3 * 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Catchment service {{ $labels.service }}: last successful round is {{ $value | humanizeDuration }} old"

      - alert: CatchmentShiftBurst
        expr: increase(catchment_shifts_total{job="catchment"}[1h]) > 20
        labels:
          severity: warning
        annotations:
          summary: "Catchment service {{ $labels.service }}: {{ $value | humanize }} vantages changed PoP in 1 hour"
          description: "Many vantages moved between PoPs. Check BGP (Pathology) and the PoPs' announcements."

      - alert: CatchmentLatencyRegression
        expr: catchment_latency_regressions{job="catchment"} > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Catchment service {{ $labels.service }}: {{ $value }} countries above their latency baseline"

      - alert: CatchmentAtlasBudgetNearlyUsed
        expr: catchment_atlas_credits_spent{job="catchment"} > 0.9 * on(instance, job, period) catchment_atlas_credits_cap{job="catchment"}
        labels:
          severity: info
        annotations:
          summary: "Catchment has booked over 90% of its {{ $labels.period }} RIPE Atlas credit cap"
